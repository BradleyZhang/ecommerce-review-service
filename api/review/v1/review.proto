syntax = "proto3";
package review.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "review-service/api/review/v1;v1";
service ReviewService {
  // C端创建评价
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse) {
    option (google.api.http) = {
      post: "/v1/review"
      body: "*"
    };
  }
  // C端获取评价详情
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {
    option (google.api.http) = {get: "/v1/review/{review_id}"};
  }
  // O端审核评价
  rpc AuditReview(AuditReviewRequest) returns (AuditReviewResponse) {
    option (google.api.http) = {
      post: "/v1/review/audit"
      body: "*"
    };
  }
  // B端回复评价
  rpc ReplyReview(ReplyReviewRequest) returns (ReplyReviewResponse) {
    option (google.api.http) = {
      post: "/v1/review/reply"
      body: "*"
    };
  }
  // B端申诉评价
  rpc AppealReview(AppealReviewRequest) returns (AppealReviewResponse) {
    option (google.api.http) = {
      post: "/v1/review/appeal"
      body: "*"
    };
  }
  // O端评价申诉审核
  rpc AuditAppeal(AuditAppealRequest) returns (AuditAppealResponse) {
    option (google.api.http) = {
      post: "/v1/appeal/audit"
      body: "*"
    };
  }
  // C端查看userID下所有评价
  rpc ListReviewByUserID(ListReviewByUserIDRequest) returns (ListReviewByUserIDResponse) {
    option (google.api.http) = {get: "/v1/{user_id}/reviews"};
  }
}

message CreateReviewRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 order_id = 2 [(buf.validate.field).int64.gt = 0];
  int32 score = 3 [(buf.validate.field).int32 = {
    in: [
      1,
      2,
      3,
      4,
      5
    ]
  }];
  int32 service_score = 4 [(buf.validate.field).int32 = {
    in: [
      1,
      2,
      3,
      4,
      5
    ]
  }];
  int32 express_score = 5 [(buf.validate.field).int32 = {
    in: [
      1,
      2,
      3,
      4,
      5
    ]
  }]; // 物流打分
  string content = 6 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 255
  ];
  string pic_info = 7;
  string video_info = 8;
  int64 store_id = 9;
  bool anonymous = 10; // 评价匿名
}

message CreateReviewResponse {
  int64 review_id = 1;
}

// 获取评价详情的请求参数
message GetReviewRequest {
  int64 review_id = 1 [(buf.validate.field).int64.gt = 0];
}

// 获取评价详情的响应
message GetReviewResponse {
  ReviewInfo data = 1;
}

// 评价信息
message ReviewInfo {
  int64 review_id = 1;
  int64 user_id = 2;
  int64 order_id = 3;
  int32 score = 4;
  int32 service_score = 5;
  int32 express_score = 6;
  string content = 7;
  string pic_info = 8;
  string video_info = 9;
  int32 status = 10;
}

// 审核评价的请求
message AuditReviewRequest {
  int64 review_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 status = 2 [(buf.validate.field).int32.gt = 0];
  string op_user = 3 [(buf.validate.field).string.min_len = 2];
  string op_reason = 4 [(buf.validate.field).string.min_len = 2];
  optional string op_remarks = 5;
}

// 审核评价的返回值
message AuditReviewResponse {
  int64 review_id = 1;
  int32 status = 2;
}

// 回复评价的请求
message ReplyReviewRequest {
  int64 review_id = 1 [(buf.validate.field).int64.gte = 0];
  int64 store_id = 2 [(buf.validate.field).int64.gt = 0];
  string content = 3 [(buf.validate.field).string = {
    min_len: 2
    max_len: 200
  }];
  string pic_info = 4;
  string video_info = 5;
}

// 回复评价的返回值
message ReplyReviewResponse {
  int64 reply_id = 1;
}

// AppealReviewRequest 申诉评价的请求参数
message AppealReviewRequest {
  int64 review_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 store_id = 2 [(buf.validate.field).int64.gt = 0];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 2
    max_len: 200
  }];
  string content = 4 [(buf.validate.field).string = {
    min_len: 2
    max_len: 200
  }];
  string pic_info = 5;
  string video_info = 6;
}

// 对评价进行申诉的返回值
message AppealReviewResponse {
  int64 appeal_id = 1;
}

// 对申诉进行审核的请求
message AuditAppealRequest {
  int64 appeal_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 status = 2 [(buf.validate.field).int32.gt = 0];
  string op_user = 3 [(buf.validate.field).string.min_len = 2];
  optional string op_remarks = 4;
}

// 对申诉进行审核的返回值
message AuditAppealResponse {
  int64 appeal_id = 1;
}

// 用户评价列表的请求
message ListReviewByUserIDRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}

// 用户评价列表的返回值
message ListReviewByUserIDResponse {
  repeated ReviewInfo list = 1;
}
