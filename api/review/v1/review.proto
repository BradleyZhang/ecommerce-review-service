syntax = "proto3";

import "google/api/annotations.proto";
package api.review.v1; // TODO
option go_package = "review-service/api/review/v1;v1";
service Review {
  rpc CreateReview (CreateReviewRequest) returns (CreateReviewReply){
    option (google.api.http) = {
      post: "/v1/review"
      body: "*"
    };
  };
}

message CreateReviewRequest {
  int64  userID       = 1;
  int64  orderID      = 2;
  int32  score        = 3;
  int32  serviceScore = 4;
  int32  expressScore = 5; // 物流打分
  string content      = 6;
  string picInfo      = 7;
  string videoInfo    = 8;
  bool   anonymous    = 9; // 评价匿名
}

message CreateReviewReply {
  int64 reviewId = 1;
}
