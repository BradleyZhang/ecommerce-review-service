plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: api
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: api
    opt:
      - paths=source_relative

  - remote: buf.build/grpc-ecosystem/gateway:v2.26.3
    out: api
    opt:
      - paths=source_relative
      - generate_unbound_methods=true

  - remote: buf.build/grpc-ecosystem/openapiv2:v2.33.0
    out: api/docs/openapi
    # strategy: all # 插件一次性处理所有 proto (remote 不需要)
    opt:
      - allow_merge=true # 多个 proto 合并
      - merge_file_name=api # 文件名为 api
      - json_names_for_fields=false